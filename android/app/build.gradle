plugins { id 'com.android.application' }
def signingFile = new File(rootProject.projectDir.parentFile, '.local/android-signing.json')
def signing = signingFile.exists() ? new groovy.json.JsonSlurper().parse(signingFile) : null
android {
    namespace 'app.mosa.frame'
    compileSdk 35
    defaultConfig {
        applicationId 'app.mosa.frame'
        minSdk 27
        targetSdk 28
        versionCode 7
        versionName '0.2.2'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        if (signing != null) {
            mosa {
                storeFile file(signing.storeFile)
                storePassword signing.password
                keyAlias 'mosa'
                keyPassword signing.password
            }
        }
    }
    buildTypes { release { minifyEnabled false; if (signing != null) signingConfig signingConfigs.mosa } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
}
