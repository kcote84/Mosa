name: Vérifier Mosa
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm install --global firebase-tools@15.11.0
      - name: Parcours API dans les émulateurs
        run: firebase emulators:exec --project demo-mosa --only auth,firestore,storage,functions,hosting 'npm run seed:local && npm run test:integration'
      - name: Compiler l’application cadre
        run: ./android/gradlew -p android :app:testDebugUnitTest :app:assembleDebug --console=plain
